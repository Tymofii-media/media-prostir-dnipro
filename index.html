<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Медіа Простір — Дніпро</title>
  <!-- Google Fonts & FontAwesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-color: #080b11;
      --card-bg: #111723;
      --border-color: rgba(0, 140, 255, 0.2);
      --accent-blue: #0088ff;
      --accent-glow: #00d2ff;
      --text-main: #f0f4f9;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding-bottom: 60px;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 136, 255, 0.15), transparent 50%),
        radial-gradient(circle at 100% 50%, rgba(0, 210, 255, 0.05), transparent 40%);
      background-attachment: fixed;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }

    /* HEADER SECTION */
    header {
      text-align: center;
      padding: 40px 20px 20px;
    }

    .avatar-wrapper {
      position: relative;
      width: 140px;
      height: 140px;
      margin: 0 auto 20px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-glow));
      box-shadow: 0 0 25px rgba(0, 136, 255, 0.4);
    }

    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      background: #000;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ffffff, var(--accent-glow));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .tagline {
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 600;
    }

    /* SOCIAL LINKS */
    .social-links {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin: 30px 0 40px;
    }

    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 14px 20px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      color: var(--text-main);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .social-btn:hover {
      transform: translateY(-3px);
      border-color: var(--accent-glow);
      box-shadow: 0 6px 20px rgba(0, 210, 255, 0.25);
    }

    .social-btn.telegram i { color: #24A1DE; }
    .social-btn.tiktok i { color: #ff0050; }
    .social-btn.instagram i { color: #E1306C; }

    /* CREATE POST FORM */
    .create-post-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 35px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    }

    .create-post-card h2 {
      font-size: 1.2rem;
      margin-bottom: 15px;
      color: var(--accent-glow);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    input, textarea {
      width: 100%;
      padding: 12px 16px;
      background: #080d16;
      border: 1px solid #1e293b;
      border-radius: 8px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.3s;
    }

    input:focus, textarea:focus {
      border-color: var(--accent-blue);
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, var(--accent-blue), #0052cc);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.3s, transform 0.2s;
    }

    .btn-submit:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    /* POSTS FEED */
    .feed-title {
      font-size: 1.4rem;
      margin-bottom: 20px;
      border-left: 4px solid var(--accent-blue);
      padding-left: 12px;
    }

    .posts-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .post-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 20px;
      position: relative;
      transition: border-color 0.3s;
    }

    .post-card:hover {
      border-color: var(--border-color);
    }

    .post-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .post-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
    }

    .post-date {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .post-content {
      color: #cbd5e1;
      font-size: 0.95rem;
      white-space: pre-line;
      margin-bottom: 12px;
    }

    .post-media {
      width: 100%;
      max-height: 400px;
      object-fit: cover;
      border-radius: 10px;
      margin-top: 10px;
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 0.85rem;
      margin-top: 10px;
      opacity: 0.7;
      transition: opacity 0.2s;
    }

    .delete-btn:hover {
      opacity: 1;
    }

    footer {
      text-align: center;
      margin-top: 50px;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- HEADER -->
    <header>
      <div class="avatar-wrapper">
        <!-- Покладіть файл вашої аватарки поруч і назвіть image.png або logo.png -->
        <img src="image.png" alt="Медіа Простір Дніпро" onerror="this.src='https://via.placeholder.com/140/080b11/0088ff?text=MP'">
      </div>
      <h1>Медіа Простір — Дніпро</h1>
      <p class="tagline">Офіційний інфопростір • Новини, події та медіа Дніпра</p>
    </header>

    <!-- SOCIAL MEDIA LINKS -->
    <div class="social-links">
      <a href="https://t.me/media_prostir_dnipro" target="_blank" class="social-btn telegram">
        <i class="fa-brands fa-telegram fa-lg"></i> Telegram Канал
      </a>
      <a href="https://www.tiktok.com/@timofii.press" target="_blank" class="social-btn tiktok">
        <i class="fa-brands fa-tiktok fa-lg"></i> TikTok
      </a>
      <a href="https://www.instagram.com/tymofii.press" target="_blank" class="social-btn instagram">
        <i class="fa-brands fa-instagram fa-lg"></i> Instagram
      </a>
    </div>

    <!-- FORM TO ADD NEW POSTS -->
    <div class="create-post-card">
      <h2><i class="fa-solid fa-pen-to-square"></i> Опублікувати новину / замітку</h2>
      <form id="postForm">
        <div class="form-group">
          <input type="text" id="postTitle" placeholder="Заголовок публікації..." required>
        </div>
        <div class="form-group">
          <textarea id="postContent" placeholder="Текст публікації..." required></textarea>
        </div>
        <div class="form-group">
          <input type="url" id="postImage" placeholder="Посилання на картинку (необов'язково, напр. https://site.com/image.jpg)">
        </div>
        <button type="submit" class="btn-submit"><i class="fa-solid fa-paper-plane"></i> Опублікувати</button>
      </form>
    </div>

    <!-- POSTS FEED -->
    <h2 class="feed-title">Останні публікації</h2>
    <div id="postsList" class="posts-list">
      <!-- Пости з'являтимуться тут -->
    </div>

    <footer>
      <p>© Медіа Простір — Дніпро. Усі права захищено.</p>
    </footer>

  </div>

  <script>
    // Ініціалізація початкових постів, якщо їх немає
    const defaultPosts = [
      {
        id: 1,
        title: "Ласкаво просимо до «Медіа Простір — Дніпро»!",
        content: "Вітаємо на нашому офіційному сайті! Тут ми будемо ділитися важливими новинами Дніпра, ексклюзивними матеріалами та анонсами.\n\nПідписуйтесь також на наші соцмережі в Telegram, TikTok та Instagram!",
        image: "",
        date: "Сьогодні"
      }
    ];

    // Отримання постів з localStorage
    function getPosts() {
      const stored = localStorage.getItem('mp_dnipro_posts');
      return stored ? JSON.parse(stored) : defaultPosts;
    }

    // Збереження постів
    function savePosts(posts) {
      localStorage.setItem('mp_dnipro_posts', JSON.stringify(posts));
    }

    // Відображення постів
    function renderPosts() {
      const posts = getPosts();
      const container = document.getElementById('postsList');
      container.innerHTML = '';

      if (posts.length === 0) {
        container.innerHTML = '<p style="color: var(--text-muted); text-align: center;">Постів поки немає.</p>';
        return;
      }

      posts.forEach(post => {
        const postEl = document.createElement('div');
        postEl.className = 'post-card';
        
        let imgHtml = post.image ? `<img src="${post.image}" class="post-media" alt="Медіа" onerror="this.style.display='none'">` : '';

        postEl.innerHTML = `
          <div class="post-header">
            <div class="post-title">${post.title}</div>
            <div class="post-date">${post.date}</div>
          </div>
          <div class="post-content">${post.content}</div>
          ${imgHtml}
          <button class="delete-btn" onclick="deletePost(${post.id})">
            <i class="fa-solid fa-trash"></i> Видалити
          </button>
        `;

        container.appendChild(postEl);
      });
    }

    // Додавання нового поста
    document.getElementById('postForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const title = document.getElementById('postTitle').value;
      const content = document.getElementById('postContent').value;
      const image = document.getElementById('postImage').value;

      const now = new Date();
      const dateStr = now.toLocaleDateString('uk-UA', { day: '2-digit', month: '2-digit', year: 'numeric' });

      const newPost = {
        id: Date.now(),
        title,
        content,
        image,
        date: dateStr
      };

      const posts = getPosts();
      posts.unshift(newPost); // нові пости зверху
      savePosts(posts);
      renderPosts();

      // Очищення форми
      this.reset();
    });

    // Видалення поста
    function deletePost(id) {
      if (confirm('Видалити цю публікацію?')) {
        let posts = getPosts();
        posts = posts.filter(p => p.id !== id);
        savePosts(posts);
        renderPosts();
      }
    }

    // Початковий рендер
    renderPosts();
  </script>
</body>
</html>
