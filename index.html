<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Медіа Простір — Дніпро</title>
<meta name="description" content="Медіа Простір — Дніпро. Новини Дніпра та України.">
<style>
:root{--blue:#0b57d0;--yellow:#ffd400;--text:#111;--muted:#737373;--bg:#f5f6f8;--card:#fff;--line:#e6e7ea}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
a{color:inherit;text-decoration:none}.top{background:#111;color:#fff;font-size:13px}.wrap{max-width:1180px;margin:auto;padding:0 18px}
.topin{height:36px;display:flex;align-items:center;justify-content:space-between}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.head{height:78px;display:flex;align-items:center;gap:28px}.logo{font-weight:900;font-size:22px;line-height:1}.logo span{color:var(--blue)}
nav{display:flex;gap:20px;font-weight:700;font-size:14px;flex:1}nav a:hover{color:var(--blue)}
.search{border:1px solid var(--line);border-radius:10px;padding:10px 13px;width:190px}
.hero{display:grid;grid-template-columns:1.7fr 1fr;gap:18px;margin:24px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 2px 10px #00000008}
.heroMain img,.newsimg{width:100%;object-fit:cover;background:#ddd}.heroMain img{height:370px}.heroText{padding:18px}.tag{color:var(--blue);font-size:12px;font-weight:800;text-transform:uppercase}.title{font-size:32px;line-height:1.08;margin:8px 0}.meta{font-size:12px;color:var(--muted);margin-top:10px}
.side{display:grid;gap:18px}.side .item{padding:16px}.side h3{font-size:19px;line-height:1.2;margin:7px 0}
.sectionTitle{display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid #111;padding-bottom:9px;margin:28px 0 15px}
.sectionTitle h2{margin:0;font-size:24px}.sectionTitle span{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.newsimg{height:190px}.newsbody{padding:14px}.newsbody h3{font-size:19px;line-height:1.18;margin:7px 0}.excerpt{font-size:14px;color:#555;line-height:1.45}
.latest{display:grid;grid-template-columns:1fr 1fr;gap:0 30px}.latestItem{padding:16px 0;border-bottom:1px solid var(--line)}.latestItem h3{margin:5px 0;font-size:18px}
.empty{padding:35px;text-align:center;color:var(--muted);background:#fff;border:1px dashed #ccc;border-radius:12px}
footer{margin-top:50px;background:#111;color:#fff;padding:35px 0}.foot{display:flex;justify-content:space-between;gap:30px}.small{color:#aaa;font-size:13px}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal.open{display:flex}.modalbox{background:#fff;max-width:850px;width:100%;max-height:92vh;overflow:auto;border-radius:15px}.modalbox img{width:100%;max-height:480px;object-fit:cover}.modalcontent{padding:22px}.close{float:right;border:0;background:#eee;border-radius:50%;width:34px;height:34px;font-size:20px}
@media(max-width:850px){.head{height:auto;min-height:68px;flex-wrap:wrap;padding:12px 18px}.search{display:none}nav{order:3;width:100%;overflow:auto;padding-bottom:7px;gap:16px}.hero{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.latest{grid-template-columns:1fr}.heroMain img{height:260px}.title{font-size:27px}}
@media(max-width:520px){.grid{grid-template-columns:1fr}.logo{font-size:19px}}
</style>
</head>
<body>
<div class="top"><div class="wrap topin"><span>Дніпро • Україна</span><span id="today"></span></div></div>
<header><div class="wrap head">
<a class="logo" href="#">МЕДІА <span>ПРОСТІР</span> — ДНІПРО</a>
<nav><a href="#dnipro">Дніпро</a><a href="#ukraine">Україна</a><a href="#important">Важливе</a><a href="#events">Події</a><a href="#crime">Кримінал</a></nav>
<input class="search" id="search" placeholder="Пошук новин…">
</div></header>
<main class="wrap">
<section id="hero" class="hero"></section>
<section><div class="sectionTitle"><h2>Останні новини</h2><span>Оновлюється з адмінки</span></div><div id="latest" class="latest"></div></section>
<section id="dnipro"><div class="sectionTitle"><h2>Дніпро</h2><span>Новини міста</span></div><div id="dniproGrid" class="grid"></div></section>
<section id="ukraine"><div class="sectionTitle"><h2>Україна</h2><span>Новини країни</span></div><div id="ukraineGrid" class="grid"></div></section>
</main>
<footer><div class="wrap foot"><div><b>Медіа Простір — Дніпро</b><p class="small">Незалежне інформаційне медіа.</p></div><div class="small">Дніпро • Україна<br>© <span id="year"></span> Медіа Простір</div></div></footer>
<div id="modal" class="modal"><div class="modalbox"><button class="close" onclick="closeModal()">×</button><div id="modalBody"></div></div></div>
<script>
/* ==============================
   ВСТАВ СЮДА ДАННЫЕ SUPABASE
   ============================== */
const SUPABASE_URL = "https://gxftjggpgxufmsueange.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_a_yJAbmaPaVH5v-O1pHUVQ_1Ysz3e68";

const fallback = [];
let allNews=[];

function esc(s=""){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function fmt(d){return new Date(d).toLocaleString("uk-UA",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"})}
function img(src){return src?esc(src):"https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=1200&q=80"}
function card(n){return `<article class="card"><a href="#" onclick="openNews('${n.id}');return false"><img class="newsimg" src="${img(n.image_url)}" alt=""><div class="newsbody"><div class="tag">${esc(n.category||"Новини")}</div><h3>${esc(n.title)}</h3><div class="excerpt">${esc((n.excerpt||n.content||"").slice(0,150))}</div><div class="meta">${fmt(n.created_at)}</div></div></a></article>`}
function render(list){
 allNews=list;
 const sorted=[...list].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
 const hero=sorted[0];
 document.getElementById("hero").innerHTML=hero?`<article class="card heroMain"><a href="#" onclick="openNews('${hero.id}');return false"><img src="${img(hero.image_url)}" alt=""><div class="heroText"><div class="tag">${esc(hero.category||"Важливе")}</div><div class="title">${esc(hero.title)}</div><div class="excerpt">${esc(hero.excerpt||"")}</div><div class="meta">${fmt(hero.created_at)} • ${esc(hero.author||"Медіа Простір — Дніпро")}</div></div></a></article><div class="side">${sorted.slice(1,4).map(n=>`<article class="card item"><div class="tag">${esc(n.category||"Новини")}</div><h3><a href="#" onclick="openNews('${n.id}');return false">${esc(n.title)}</a></h3><div class="meta">${fmt(n.created_at)}</div></article>`).join("")}</div>`:"";
 document.getElementById("latest").innerHTML=sorted.length?sorted.slice(0,10).map(n=>`<article class="latestItem"><div class="tag">${esc(n.category||"Новини")}</div><h3><a href="#" onclick="openNews('${n.id}');return false">${esc(n.title)}</a></h3><div class="meta">${fmt(n.created_at)}</div></article>`).join(""):`<div class="empty">Новин поки немає.</div>`;
 const dn=sorted.filter(n=>n.region==="Дніпро"||n.category==="Дніпро").slice(0,6);
 const ua=sorted.filter(n=>n.region==="Україна"||n.category==="Україна").slice(0,6);
 document.getElementById("dniproGrid").innerHTML=dn.length?dn.map(card).join(""):`<div class="empty">Поки немає новин Дніпра.</div>`;
 document.getElementById("ukraineGrid").innerHTML=ua.length?ua.map(card).join(""):`<div class="empty">Поки немає новин України.</div>`;
}
async function load(){
 if(SUPABASE_URL.startsWith("ВСТАВЬ")){render(fallback);return}
 try{
  const r=await fetch(`${SUPABASE_URL}/rest/v1/news?select=*&published=eq.true&order=created_at.desc`,{headers:{apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${SUPABASE_ANON_KEY}`}});
  if(!r.ok) throw new Error();
  render(await r.json());
 }catch(e){render(fallback)}
}
function openNews(id){const n=allNews.find(x=>String(x.id)===String(id));if(!n)return;document.getElementById("modalBody").innerHTML=`<img src="${img(n.image_url)}" alt=""><div class="modalcontent"><div class="tag">${esc(n.category||"Новини")}</div><h1>${esc(n.title)}</h1><div class="meta">${fmt(n.created_at)} • ${esc(n.author||"Медіа Простір — Дніпро")}</div><p style="white-space:pre-wrap;line-height:1.7;font-size:17px">${esc(n.content||"")}</p>${n.video_url?`<p><a style="color:#0b57d0;font-weight:700" target="_blank" href="${esc(n.video_url)}">▶ Переглянути відео</a></p>`:""}</div>`;document.getElementById("modal").classList.add("open")}
function closeModal(){document.getElementById("modal").classList.remove("open")}
document.getElementById("search").addEventListener("input",e=>{const q=e.target.value.toLowerCase();render(allNews.filter(n=>(n.title+" "+n.content+" "+n.excerpt).toLowerCase().includes(q)))});
document.getElementById("today").textContent=new Date().toLocaleDateString("uk-UA",{day:"2-digit",month:"2-digit",year:"numeric"});
document.getElementById("year").textContent=new Date().getFullYear(); load();
</script>
</body></html>
